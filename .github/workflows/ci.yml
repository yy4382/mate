name: Checks

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

# `pnpm check` is split across parallel jobs, because a runner has two cores and the suite is CPU-bound; together
# they check what `pnpm check` and `pnpm test:linux` check, plus the mobile bundles. The node suite also runs on macOS and Windows.
# The `checks` job is the one result that a release waits for.
jobs:
  changes:
    name: build scope
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.scope.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.ref_type != 'tag'
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ] || [[ "$BASE" =~ ^0+$ ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            git diff --no-renames --name-only -z "$BASE...$HEAD" > "$RUNNER_TEMP/build-files"
          else
            git diff --no-renames --name-only -z "$BASE" "$HEAD" > "$RUNNER_TEMP/build-files"
          fi
          while IFS= read -r -d '' file; do
            case "$file" in
              *.md|*.mdx|*.markdown|*.rst|*.adoc|*.asciidoc|docs/*|LICENSE|LICENSE.*|NOTICE|NOTICE.*) ;;
              *) echo "build=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
            esac
          done < "$RUNNER_TEMP/build-files"
          echo "build=false" >> "$GITHUB_OUTPUT"

  types:
    name: format and types
    if: github.ref_type != 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm --filter @mate/mobile bundle:check

  test:
    name: vitest
    if: github.ref_type != 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The page tests (apps/web) drive headless Chromium. The runner image already has its system libraries, so
      # only the browser is fetched, once per Playwright version (`--with-deps` spent 6-10 minutes in apt).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm --filter @mate/web exec playwright install chromium-headless-shell
      # The node and system suites run in the test-linux jobs, in the container they are written for.
      - run: pnpm test --exclude 'apps/node/**' --exclude 'tests/system/**'

  test-linux:
    name: pnpm test:linux (${{ matrix.shard }}/2)
    if: github.ref_type != 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      # Ubuntu 24.04 forbids unprivileged user namespaces through AppArmor; the PID-reuse test needs one.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: pnpm test:linux apps/node tests/system --shard=${{ matrix.shard }}/2

  deploy-script:
    name: mate-deploy
    if: github.ref_type != 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sh deploy/auto-update/test.sh

  node-platforms:
    name: node (${{ matrix.os }})
    if: github.ref_type != 'tag'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin
          - os: windows-latest
            platform: win32
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: host
        run: node -e "require('node:fs').appendFileSync(process.env.GITHUB_OUTPUT, 'arch=' + process.arch + '\n')"
      - run: pnpm bundle:node 0.0.0-ci --platform ${{ matrix.platform }} --arch ${{ steps.host.outputs.arch }}
      - run: pnpm bundle:node 0.0.0-ci-update --platform ${{ matrix.platform }} --arch ${{ steps.host.outputs.arch }} --out dist/node-update-bundles
      - run: pnpm test apps/node --maxWorkers=2 --testTimeout=60000
        env:
          MATE_TEST_BUNDLE_DIRECTORY: dist/node-bundles
          MATE_TEST_UPDATE_BUNDLE_DIRECTORY: dist/node-update-bundles
          MATE_TEST_NATIVE_SERVICE: "1"

  # Runs even when a check fails, so that it fails too instead of being skipped.
  checks:
    name: checks
    if: github.ref_type != 'tag' && always()
    needs: [changes, types, test, test-linux, deploy-script, node-platforms, release]
    runs-on: ubuntu-24.04
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          node <<'NODE'
          const needs = JSON.parse(process.env.NEEDS);
          for (const [name, job] of Object.entries(needs)) {
            console.log(`${name}: ${job.result}`);
            if (job.result === "success") continue;
            if (name === "release" && job.result === "skipped" && needs.changes.outputs.build === "false") continue;
            process.exit(1);
          }
          NODE

  release:
    name: Image and node bundles
    needs: [changes]
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
      checks: read
    env:
      VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v0.0.0-ci' }}
    steps:
      - name: Wait for the checks to pass on main for this commit
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$GITHUB_SHA" --jq .status)
          case "$status" in identical | behind) ;; *) echo "$VERSION is not on main ($status)"; exit 1 ;; esac
          # The latest `checks` run decides, so a rerun that passes counts; this tag run's own skipped one does not.
          for _ in $(seq 120); do
            latest=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?check_name=checks" --jq '
              [.check_runs[] | select(.conclusion != "skipped")] | max_by(.started_at) | .conclusion // "pending"')
            echo "checks: $latest"
            case "$latest" in
              success) exit 0 ;;
              failure | cancelled | timed_out) echo "the checks did not pass for $GITHUB_SHA"; exit 1 ;;
            esac
            sleep 10
          done
          echo "the checks did not finish in 20 minutes"; exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm bundle:node "${VERSION#v}"
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          platforms: arm64
      - name: Log in to the image registry
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Build the control-plane image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}-control-plane"
          docker buildx create --use
          docker buildx build --file deploy/control-plane/Dockerfile --platform linux/amd64,linux/arm64 \
            --build-arg "MATE_VERSION=${VERSION#v}" --tag "$image:${VERSION#v}" \
            --push=${{ startsWith(github.ref, 'refs/tags/v') }} .
      - name: Publish the node bundles
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$VERSION" dist/node-bundles/* --title "$VERSION" --generate-notes

  # Runs deploy/auto-update/mate-deploy on the production host through its forced-command SSH key
  # (DEPLOYMENT.md 5.5). The host, key and host key live only in the production environment's secrets;
  # until DEPLOY_HOST is set there, the job does nothing.
  deploy:
    name: Deploy
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      VERSION: ${{ github.ref_name }}
      ARCH: ${{ vars.DEPLOY_NODE_ARCH || 'x64' }}
    steps:
      - name: Check that a host is configured
        id: configured
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          if [ -n "$HOST" ]; then echo "yes=true" >> "$GITHUB_OUTPUT"; else echo "DEPLOY_HOST is not set; not deploying"; fi
      - name: Download the node bundle
        if: steps.configured.outputs.yes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "$VERSION" --repo "$GITHUB_REPOSITORY" --pattern "mate-node-${VERSION#v}-linux-$ARCH.tar.gz"
      - name: Upgrade the host
        if: steps.configured.outputs.yes == 'true'
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 0700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy
          chmod 0600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          bundle="mate-node-${VERSION#v}-linux-$ARCH.tar.gz"
          sha=$(sha256sum "$bundle" | cut -d' ' -f1)
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o BatchMode=yes "$HOST" "deploy ${VERSION#v} $sha" < "$bundle"
