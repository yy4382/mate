name: Checks

# A v* tag runs the same checks, and the release job publishes only after both pass.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: pnpm check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The page tests (apps/web) drive headless Chromium.
      - run: pnpm --filter @mate/web exec playwright install --with-deps chromium-headless-shell
      - run: pnpm check

  test-linux:
    name: pnpm test:linux
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      # Ubuntu 24.04 forbids unprivileged user namespaces through AppArmor; the PID-reuse test needs one.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: pnpm test:linux
      - run: sh deploy/auto-update/test.sh

  release:
    name: Image and node bundles
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, test-linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm bundle:node "${VERSION#v}"
      - name: Push the control-plane image
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}-control-plane"
          echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker buildx create --use
          docker buildx build --file deploy/control-plane/Dockerfile --platform linux/amd64,linux/arm64 \
            --build-arg "MATE_VERSION=${VERSION#v}" --tag "$image:${VERSION#v}" --push .
      - name: Publish the node bundles
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$VERSION" dist/node-bundles/* --title "$VERSION" --generate-notes

  # Runs deploy/auto-update/mate-deploy on the production host through its forced-command SSH key
  # (DEPLOYMENT.md 5.5). The host, key and host key live only in the production environment's secrets;
  # until DEPLOY_HOST is set there, the job does nothing.
  deploy:
    name: Deploy
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      VERSION: ${{ github.ref_name }}
      ARCH: ${{ vars.DEPLOY_NODE_ARCH || 'x64' }}
    steps:
      - name: Check that a host is configured
        id: configured
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          if [ -n "$HOST" ]; then echo "yes=true" >> "$GITHUB_OUTPUT"; else echo "DEPLOY_HOST is not set; not deploying"; fi
      - name: Download the node bundle
        if: steps.configured.outputs.yes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "$VERSION" --repo "$GITHUB_REPOSITORY" --pattern "mate-node-${VERSION#v}-linux-$ARCH.tar.gz"
      - name: Upgrade the host
        if: steps.configured.outputs.yes == 'true'
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 0700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy
          chmod 0600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          bundle="mate-node-${VERSION#v}-linux-$ARCH.tar.gz"
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o BatchMode=yes "$HOST" \
            "deploy ${VERSION#v} $(sha256sum "$bundle" | cut -d' ' -f1)" < "$bundle"
