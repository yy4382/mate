# Only for the first start: hands the first admin's password file and handle to the control plane, which reads them
# while no human exists and never again. Leave this file out once you have logged in, then delete the password file.
services:
  control-plane:
    environment:
      PALACE_INITIAL_PASSWORD_FILE: /run/secrets/initial_password
      PALACE_INITIAL_HANDLE: ${PALACE_INITIAL_HANDLE:-admin}
    secrets:
      - initial_password
secrets:
  initial_password:
    file: ${PALACE_INITIAL_PASSWORD:?set PALACE_INITIAL_PASSWORD to the initial password file}
