# The control plane as one Compose service. Settings come from `.env` next to this file (see .env.example).
# First start: `docker compose -f compose.yaml -f compose.initialize.yaml up -d`; afterwards `docker compose up -d`.
services:
  control-plane:
    image: ${PALACE_IMAGE:?set PALACE_IMAGE to an exact control-plane image tag}
    user: "${PALACE_UID:?set PALACE_UID to the control-plane system account's UID}:${PALACE_GID:?set PALACE_GID to the control-plane system account's GID}"
    environment:
      PALACE_DATA_DIRECTORY: /var/lib/palace
      PALACE_HOST: 0.0.0.0
      PALACE_PORT: "8787"
      PALACE_WEB_DIRECTORY: /opt/palace/web
      PALACE_VAPID_SUBJECT: ${PALACE_VAPID_SUBJECT:-mailto:owner@palace.invalid}
    ports:
      - "${PALACE_LISTEN:-127.0.0.1:8787}:8787"
    volumes:
      - type: bind
        source: ${PALACE_DATA:?set PALACE_DATA to an existing private (0700) data directory}
        target: /var/lib/palace
        bind:
          create_host_path: false
    restart: unless-stopped
